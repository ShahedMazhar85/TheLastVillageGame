<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Last Village — tests</title>
<!--
  Run from a local server (iframes can't be scripted over file://):
    python3 tests/serve.py           (in the project folder; disables caching)
    open http://localhost:8765/tests/
  Add ?record to print fresh golden values instead of comparing.
-->
<style>
  body { font: 14px/1.5 system-ui, sans-serif; margin: 20px; background: #f6f3ec; color: #222; }
  .pass { color: #1a7f37; } .fail { color: #c62828; }
  pre { background: #fff; border: 1px solid #ddd; padding: 8px; white-space: pre-wrap; }
  iframe { width: 1280px; height: 800px; border: 0; position: absolute; left: -9999px; }
</style>
<script src="golden.js"></script>
<!-- Game rules loaded directly for the unit tests -->
<script src="../js/config.js"></script>
<script src="../js/util.js"></script>
<script src="../js/sim.js"></script>
<script src="unit.js"></script>
</head>
<body>
<h1>The Last Village — tests</h1>
<p id="summary">Running…</p>
<ol id="list"></ol>
<pre id="out" hidden></pre>
<iframe id="game"></iframe>
<script>
(() => {
  const RECORD = location.search.includes('record');
  const results = [];
  window.testResults = null;

  function mulberry32(n) {
    let a = n >>> 0;
    return () => {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // The auto-play bot used for balance testing, made deterministic
  function botRun(lv, { seed, skill, jitter, seconds, every }) {
    lv.seed(seed); lv.start();
    const r = mulberry32(seed + 1000), shots = [];
    const weaponCost = [0, 50, 80, 120, 170, 230], towerCost = [0, 60, 100, 160];
    for (let f = 0; f < seconds * 60 && lv.mode === 'play'; f++) {
      const v = lv.view(), p = v.player;
      let target = null, best = Infinity;
      for (const e of v.enemies) { const d = Math.hypot(e.x - 640, e.y - 400); if (d < best) { best = d; target = e; } }
      if (target && r() < skill) { lv.aimWorld(target.x + (r() - .5) * jitter, target.y + (r() - .5) * jitter); lv.fire(true); }
      else lv.fire(false);
      let coin = null, cb = Infinity;
      for (const c of v.coins) { const d = Math.hypot(c.x - p.x, c.y - p.y); if (d < cb) { cb = d; coin = c; } }
      const goal = coin || { x: 770, y: 400 }, dx = goal.x - p.x, dy = goal.y - p.y, d = Math.hypot(dx, dy);
      if (d > 2) { p.x += dx / d * 220 / 60; p.y += dy / d * 220 / 60; }
      if (f % 30 === 0) {
        const levels = v.towerLevels, empty = levels.indexOf(-1);
        if (v.core.hp < 100 && v.gold >= 25) lv.click('core');
        else if (empty >= 0 && v.gold >= 40) lv.click(empty);
        else if (empty < 0) {
          const low = levels.indexOf(Math.min(...levels));
          const wc = weaponCost[v.weaponLevel + 1], tc = towerCost[levels[low] + 1];
          if (wc && (!tc || wc <= tc) && v.gold >= wc) lv.click('forge');
          else if (tc && v.gold >= tc) lv.click(low);
        }
      }
      lv.tick(1 / 60);
      if ((f + 1) % (every * 60) === 0) shots.push(lv.snapshot());
    }
    shots.push(lv.snapshot());
    return shots;
  }

  function purchaseRun(lv) {
    lv.seed(4); lv.start();
    const shots = [];
    lv.click(0);                                   // can't afford
    shots.push({ ...lv.snapshot(), texts: lv.view().texts });
    lv.tick(2);
    lv.view().player.x = 520; lv.view().player.y = 470; // stand near the forge
    lv.dropCoin(530, 470, 1100);
    lv.tick(1);                                    // pick up + coin flight
    shots.push(lv.snapshot());
    for (let i = 0; i < 5; i++) lv.click(0);       // build, 3 upgrades, max
    for (let i = 0; i < 6; i++) lv.click('forge'); // 5 upgrades, max
    lv.view().core.hp = 120;
    for (let i = 0; i < 3; i++) lv.click('core');  // 170, 200, full
    shots.push({ ...lv.snapshot(), texts: lv.view().texts });
    lv.tick(20);
    shots.push(lv.snapshot());
    return shots;
  }

  const SCENARIOS = {
    accurateWin: lv => botRun(lv, { seed: 1, skill: .9, jitter: 20, seconds: 601, every: 60 }),
    sloppyWin:   lv => botRun(lv, { seed: 2, skill: .6, jitter: 70, seconds: 601, every: 60 }),
    towersOnly:  lv => botRun(lv, { seed: 3, skill: 0, jitter: 0, seconds: 120, every: 5 }),
    purchases:   purchaseRun,
  };

  function report(name, ok, detail) {
    results.push({ name, ok, detail });
    const li = document.createElement('li');
    li.className = ok ? 'pass' : 'fail';
    li.textContent = `${ok ? 'PASS' : 'FAIL'} — ${name}${detail ? ': ' + detail : ''}`;
    document.getElementById('list').appendChild(li);
  }

  function runGolden(lv) {
    const recorded = {};
    for (const [name, run] of Object.entries(SCENARIOS)) {
      const shots = run(lv);
      recorded[name] = shots;
      if (RECORD) continue;
      const want = (window.GOLDEN || {})[name];
      if (!want) { report(`golden: ${name}`, false, 'no golden values recorded'); continue; }
      const i = shots.findIndex((s, k) => JSON.stringify(s) !== JSON.stringify(want[k]));
      const ok = i < 0 && shots.length === want.length;
      report(`golden: ${name}`, ok, ok ? `${shots.length} checkpoints match`
        : `checkpoint ${i < 0 ? shots.length : i} differs\n got  ${JSON.stringify(shots[i])}\n want ${JSON.stringify(want[i])}`);
    }
    if (RECORD) {
      const out = document.getElementById('out');
      out.hidden = false;
      out.textContent = '// Golden snapshots recorded from the pre-refactor game (seeded runs).\n'
        + '// Re-record (?record) only for intended behaviour changes.\nwindow.GOLDEN = {\n'
        + Object.entries(recorded).map(([k, v]) => `  ${k}: [\n${v.map(s => '    ' + JSON.stringify(s)).join(',\n')}\n  ]`).join(',\n')
        + '\n};\n';
      window.recorded = out.textContent;
    }
  }

  const frame = document.getElementById('game');
  frame.src = '../index.html?nocache=' + Date.now(); // always test the code on disk
  // Draws fixed frames (clock and shake stubbed) and hashes the canvas pixels
  async function renderHashes(win) {
    await win.document.fonts.ready;
    const lv = win.__lv;
    lv.seed(7); lv.start(); lv.gold(500);
    lv.click(0); lv.click(1); lv.click(1); lv.click('forge');
    lv.tick(30);
    lv.view().core.hp = 50; // show the low-health vignette and repair label
    win.performance.now = () => 12345;
    win.Math.random = () => .5;
    const canvas = win.document.getElementById('game'), hashes = {};
    for (const target of [null, 0, 'forge', 'core']) {
      lv.drawFrame(target);
      const px = canvas.getContext('2d').getImageData(0, 0, canvas.width, canvas.height).data;
      let h = 0x811c9dc5;
      for (let i = 0; i < px.length; i++) h = Math.imul(h ^ px[i], 16777619);
      hashes[String(target)] = (h >>> 0).toString(16);
    }
    return hashes;
  }

  frame.addEventListener('load', async () => {
    const win = frame.contentWindow, lv = win.__lv;
    try { runGolden(lv); } catch (e) { report('test run', false, e.stack || String(e)); }
    try {
      const hashes = await renderHashes(win);
      if (RECORD) document.getElementById('out').textContent += `\nrender: ${JSON.stringify(hashes)}\n`;
      else {
        const want = (window.GOLDEN || {}).render;
        const ok = JSON.stringify(hashes) === JSON.stringify(want);
        report('render snapshot', ok, ok ? '4 frames match' : `got ${JSON.stringify(hashes)} want ${JSON.stringify(want)}`);
      }
    } catch (e) { report('render snapshot', false, e.stack || String(e)); }
    // Unit tests that load the game rules directly are registered here as window.unitTests
    for (const [name, fn] of Object.entries(window.unitTests || {})) {
      try { fn(); report(name, true); } catch (e) { report(name, false, e.message); }
    }
    const failed = results.filter(r => !r.ok).length;
    window.testResults = { passed: results.length - failed, failed, results };
    const sum = document.getElementById('summary');
    sum.textContent = RECORD ? 'Recorded golden values below.' : `${results.length - failed} passed, ${failed} failed`;
    sum.className = failed ? 'fail' : 'pass';
  });
})();
</script>
</body>
</html>
